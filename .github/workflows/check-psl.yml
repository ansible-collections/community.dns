name: Check for Public Suffix List updates
"on":
  push:
    branches:
      - main
    paths:
      - plugins/public_suffix_list.dat
  # Run CI once per day (at 04:30 UTC)
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  update_check:
    uses: ansible-community/antsibull-nox/.github/workflows/reusable-nox-run.yml@main
    with:
      session-name: Check for Public Suffix List updates
      sessions: update-psl
